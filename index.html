<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Iron The Poster</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #d8d8d8;
    cursor: none;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 整张海报区域 */
  #poster-wrap {
    position: relative;

    height: 94vh;
    aspect-ratio: 0.707 / 1;

    max-width: 92vw;
    overflow: hidden;

    box-shadow:
      0 20px 40px rgba(0, 0, 0, 0.28);
  }

  /* 平整海报 */
  #flat-poster {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    user-select: none;
    pointer-events: none;
  }

  /* 皱海报 canvas */
  #wrinkle-canvas {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 2;

    pointer-events: none;
  }

  /* 熨斗 */
  #iron {
    position: fixed;

    width: 230px;
    height: auto;

    left: 0;
    top: 0;

    z-index: 10;

    pointer-events: none;
    user-select: none;

    transform:
      translate(-28%, -72%)
      rotate(-8deg);

    filter:
      drop-shadow(
        12px 16px 10px rgba(0,0,0,0.3)
      );

    transition:
      transform 0.1s ease,
      filter 0.1s ease;
  }

  body.ironing #iron {
    transform:
      translate(-28%, -70%)
      rotate(-8deg)
      scale(0.98);

    filter:
      drop-shadow(
        6px 8px 5px rgba(0,0,0,0.24)
      );
  }

  /* 左上角说明 */
  #instruction {
    position: fixed;

    left: 22px;
    top: 20px;

    z-index: 20;

    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.08em;

    color: #111;

    pointer-events: none;
  }
</style>
</head>


<body>

  <div id="poster-wrap">

    <!-- 下面：完全平整的原海报 -->
    <img
      id="flat-poster"
      src="poster.png"
      draggable="false"
      alt=""
    >

    <!-- 上面：皱海报 -->
    <canvas id="wrinkle-canvas"></canvas>

  </div>


  <!-- 熨斗 -->
  <img
    id="iron"
    src="iron.png"
    draggable="false"
    alt=""
  >


  <div id="instruction">
    HOLD + DRAG TO IRON
  </div>


<script>

const wrap =
  document.getElementById("poster-wrap");

const canvas =
  document.getElementById("wrinkle-canvas");

const ctx =
  canvas.getContext("2d");

const iron =
  document.getElementById("iron");

const wrinkledImage =
  new Image();

wrinkledImage.src =
  "poster-wrinkled.png";


let ironing = false;

let lastX = null;
let lastY = null;



/* ================================
   把皱版画进 Canvas
================================ */

function setupCanvas() {

  const rect =
    wrap.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;


  canvas.width =
    Math.round(rect.width * dpr);

  canvas.height =
    Math.round(rect.height * dpr);


  canvas.style.width =
    rect.width + "px";

  canvas.style.height =
    rect.height + "px";


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  ctx.globalCompositeOperation =
    "source-over";


  ctx.clearRect(
    0,
    0,
    rect.width,
    rect.height
  );


  ctx.drawImage(
    wrinkledImage,
    0,
    0,
    rect.width,
    rect.height
  );

}



wrinkledImage.onload =
  setupCanvas;


window.addEventListener(
  "resize",
  setupCanvas
);



/* ================================
   熨平
================================ */

function ironAt(
  clientX,
  clientY
) {

  const rect =
    canvas.getBoundingClientRect();


  /* 鼠标不在海报上就不擦 */
  if (
    clientX < rect.left ||
    clientX > rect.right ||
    clientY < rect.top ||
    clientY > rect.bottom
  ) {
    return;
  }


  const x =
    clientX - rect.left;

  const y =
    clientY - rect.top;


  /*
    熨平范围
    想大一点就把 95 改成 120
  */

  const radius = 95;


  ctx.save();


  /*
    destination-out =
    把皱版擦掉，
    露出下面平整海报
  */

  ctx.globalCompositeOperation =
    "destination-out";


  const gradient =
    ctx.createRadialGradient(
      x,
      y,
      radius * 0.15,
      x,
      y,
      radius
    );


  gradient.addColorStop(
    0,
    "rgba(0,0,0,1)"
  );

  gradient.addColorStop(
    0.55,
    "rgba(0,0,0,0.9)"
  );

  gradient.addColorStop(
    0.82,
    "rgba(0,0,0,0.45)"
  );

  gradient.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );


  ctx.fillStyle = gradient;


  ctx.beginPath();

  ctx.arc(
    x,
    y,
    radius,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.restore();

}



/* ================================
   熨斗跟随鼠标
================================ */

document.addEventListener(
  "mousemove",
  function(event) {

    const x =
      event.clientX;

    const y =
      event.clientY;


    iron.style.left =
      x + "px";

    iron.style.top =
      y + "px";


    if (!ironing) {
      return;
    }


    /*
      鼠标移动快时自动补点，
      避免熨出来断断续续
    */

    if (
      lastX !== null &&
      lastY !== null
    ) {

      const dx =
        x - lastX;

      const dy =
        y - lastY;


      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      const steps =
        Math.max(
          1,
          Math.ceil(distance / 10)
        );


      for (
        let i = 0;
        i <= steps;
        i++
      ) {

        const px =
          lastX +
          dx * (i / steps);

        const py =
          lastY +
          dy * (i / steps);


        ironAt(
          px,
          py
        );

      }

    }

    else {

      ironAt(
        x,
        y
      );

    }


    lastX = x;
    lastY = y;

  }
);



/* ================================
   按下鼠标
================================ */

document.addEventListener(
  "mousedown",
  function(event) {

    ironing = true;

    lastX =
      event.clientX;

    lastY =
      event.clientY;


    document.body.classList.add(
      "ironing"
    );


    ironAt(
      event.clientX,
      event.clientY
    );

  }
);



/* ================================
   松开鼠标
================================ */

document.addEventListener(
  "mouseup",
  function() {

    ironing = false;

    lastX = null;
    lastY = null;


    document.body.classList.remove(
      "ironing"
    );

  }
);



/* ================================
   鼠标离开窗口
================================ */

document.addEventListener(
  "mouseleave",
  function() {

    ironing = false;

    lastX = null;
    lastY = null;


    document.body.classList.remove(
      "ironing"
    );

  }
);

</script>

</body>
</html>
