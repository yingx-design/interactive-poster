<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Iron The Poster</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #cfcfcf;
  cursor: none;
}

#stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* 整张纸 */
#paper {
  position: relative;
  height: 94vh;
  aspect-ratio: 0.707 / 1;
  max-width: 94vw;

  filter:
    drop-shadow(0 22px 24px rgba(0,0,0,.28));

  overflow: hidden;
  background: black;
}

/* 平整原图 */
#flatPoster {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  user-select: none;
  pointer-events: none;
}

/* 皱褶版本 */
#wrinkledLayer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;

  pointer-events: none;

  -webkit-mask-image: url(#nothing);
}

/* SVG 铺满纸 */
#wrinkleSVG {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  pointer-events: none;
}

/* 熨斗 */
#iron {
  position: fixed;

  width: 230px;
  height: auto;

  left: 0;
  top: 0;

  z-index: 100;

  pointer-events: none;
  user-select: none;

  transform:
    translate(-28%, -72%)
    rotate(-8deg);

  filter:
    drop-shadow(
      13px 18px 11px
      rgba(0,0,0,.32)
    );

  transition:
    filter .12s ease,
    transform .12s ease;
}

body.ironing #iron {
  transform:
    translate(-28%, -70%)
    rotate(-8deg)
    scale(.985);

  filter:
    drop-shadow(
      6px 9px 5px
      rgba(0,0,0,.25)
    );
}

#instruction {
  position: fixed;

  left: 24px;
  top: 22px;

  z-index: 200;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size: 11px;
  letter-spacing: .12em;

  color: white;

  mix-blend-mode: difference;

  pointer-events: none;

  opacity: .7;
}

</style>
</head>


<body>

<div id="stage">

  <div id="paper">

    <!-- 完全平整的海报 -->
    <img
      id="flatPoster"
      src="poster.png"
      draggable="false"
    >

    <!--
      SVG负责生成真正的皱褶版本
    -->
    <svg
      id="wrinkleSVG"
      viewBox="0 0 1000 1414"
      preserveAspectRatio="none"
    >

      <defs>

        <!-- ===============================
             纸张不规则形变
        ================================ -->

        <filter
          id="paperDistortion"
          x="-15%"
          y="-15%"
          width="130%"
          height="130%"
        >

          <!-- 大型纸张起伏 -->
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.008 0.018"
            numOctaves="3"
            seed="19"
            result="largeNoise"
          />

          <!-- 细小褶皱 -->
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.035 0.075"
            numOctaves="2"
            seed="8"
            result="fineNoise"
          />

          <!-- 混合两种纹理 -->
          <feBlend
            in="largeNoise"
            in2="fineNoise"
            mode="multiply"
            result="combinedNoise"
          />

          <!-- 让整个海报发生扭曲 -->
          <feDisplacementMap
            in="SourceGraphic"
            in2="combinedNoise"
            scale="30"
            xChannelSelector="R"
            yChannelSelector="G"
            result="distorted"
          />

          <!-- 纸张光照 -->
          <feDiffuseLighting
            in="combinedNoise"
            surfaceScale="7"
            diffuseConstant="1.1"
            lighting-color="white"
            result="paperLight"
          >

            <feDistantLight
              azimuth="225"
              elevation="42"
            />

          </feDiffuseLighting>

          <!-- 把光影覆盖到海报 -->
          <feBlend
            in="distorted"
            in2="paperLight"
            mode="soft-light"
          />

        </filter>


        <!-- ===============================
             熨平区域的 Mask
        ================================ -->

        <mask id="wrinkleMask">

          <!--
            白色 = 保留皱褶
            黑色 = 显示下面平整海报
          -->

          <rect
            x="0"
            y="0"
            width="1000"
            height="1414"
            fill="white"
          />

          <g id="ironedAreas"></g>

        </mask>


        <!-- 柔软边缘 -->
        <radialGradient id="ironGradient">

          <stop
            offset="0%"
            stop-color="black"
            stop-opacity="1"
          />

          <stop
            offset="48%"
            stop-color="black"
            stop-opacity=".92"
          />

          <stop
            offset="78%"
            stop-color="black"
            stop-opacity=".45"
          />

          <stop
            offset="100%"
            stop-color="black"
            stop-opacity="0"
          />

        </radialGradient>

      </defs>


      <!--
        这张图片是真正被扭曲的海报
      -->

      <image
        href="poster.png"
        x="0"
        y="0"
        width="1000"
        height="1414"
        preserveAspectRatio="none"

        filter="url(#paperDistortion)"

        mask="url(#wrinkleMask)"
      />

    </svg>

  </div>

</div>


<img
  id="iron"
  src="iron.png"
  draggable="false"
>


<div id="instruction">
  HOLD + DRAG TO IRON
</div>


<script>

const paper =
  document.getElementById("paper");

const iron =
  document.getElementById("iron");

const ironedAreas =
  document.getElementById("ironedAreas");

let ironing = false;

let lastX = null;
let lastY = null;



/* =====================================
   熨斗跟鼠标
===================================== */

document.addEventListener(
  "mousemove",
  function(event) {

    iron.style.left =
      event.clientX + "px";

    iron.style.top =
      event.clientY + "px";


    if (!ironing) return;


    if (
      lastX !== null &&
      lastY !== null
    ) {

      const dx =
        event.clientX - lastX;

      const dy =
        event.clientY - lastY;

      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      /*
        鼠标移动太快的时候
        自动补很多点
      */

      const steps =
        Math.max(
          1,
          Math.ceil(distance / 9)
        );


      for (
        let i = 0;
        i <= steps;
        i++
      ) {

        const x =
          lastX +
          dx * (i / steps);

        const y =
          lastY +
          dy * (i / steps);

        ironAt(x, y);

      }

    }

    else {

      ironAt(
        event.clientX,
        event.clientY
      );

    }


    lastX =
      event.clientX;

    lastY =
      event.clientY;

  }
);



/* =====================================
   鼠标按下
===================================== */

document.addEventListener(
  "mousedown",
  function(event) {

    ironing = true;

    lastX =
      event.clientX;

    lastY =
      event.clientY;

    document.body.classList.add(
      "ironing"
    );

    ironAt(
      event.clientX,
      event.clientY
    );

  }
);



/* =====================================
   鼠标松开
===================================== */

document.addEventListener(
  "mouseup",
  function() {

    ironing = false;

    lastX = null;
    lastY = null;

    document.body.classList.remove(
      "ironing"
    );

  }
);



/* =====================================
   真正熨平
===================================== */

function ironAt(
  screenX,
  screenY
) {

  const rect =
    paper.getBoundingClientRect();


  /*
    鼠标不在纸上
    就不处理
  */

  if (
    screenX < rect.left ||
    screenX > rect.right ||
    screenY < rect.top ||
    screenY > rect.bottom
  ) {
    return;
  }


  /*
    转换成 SVG 坐标
  */

  const x =
    (
      (screenX - rect.left)
      / rect.width
    ) * 1000;


  const y =
    (
      (screenY - rect.top)
      / rect.height
    ) * 1414;


  /*
    创建一个柔和的熨平区域
  */

  const circle =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "circle"
    );


  circle.setAttribute(
    "cx",
    x
  );

  circle.setAttribute(
    "cy",
    y
  );


  /*
    熨斗宽度
  */

  circle.setAttribute(
    "r",
    "105"
  );


  circle.setAttribute(
    "fill",
    "url(#ironGradient)"
  );


  ironedAreas.appendChild(
    circle
  );



  /*
    防止 DOM 无限增长
  */

  if (
    ironedAreas.children.length >
    1600
  ) {

    const old =
      ironedAreas.children[0];

    old.remove();

  }

}

</script>

</body>
</html>
