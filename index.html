<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Iron The Poster</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #d7d7d7;
  cursor: none;
}

#stage {
  width: 100vw;
  height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;
}

/* 海报 */
#poster {
  position: relative;

  height: 96vh;
  max-width: 96vw;

  aspect-ratio: 0.707 / 1;

  overflow: hidden;

  background: #000;

  box-shadow:
    0 20px 45px rgba(0,0,0,.25);
}

/* 平整版在下面 */
#flatPoster {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: fill;

  pointer-events: none;
  user-select: none;
}

/* 皱版在上面 */
#wrinkledCanvas {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  z-index: 2;

  pointer-events: none;
}

/* 熨斗 */
#iron {
  position: fixed;

  width: 230px;
  height: auto;

  left: -500px;
  top: -500px;

  z-index: 20;

  pointer-events: none;
  user-select: none;

  /*
    鼠标位置对应熨斗底部前方
  */
  transform:
    translate(-31%, -76%)
    rotate(-8deg);

  transform-origin: center center;

  filter:
    drop-shadow(
      10px 14px 8px
      rgba(0,0,0,.28)
    );
}

/* 按下的时候稍微有压纸感 */
body.ironing #iron {
  transform:
    translate(-31%, -73%)
    rotate(-8deg)
    scale(.985);

  filter:
    drop-shadow(
      5px 7px 4px
      rgba(0,0,0,.22)
    );
}

#hint {
  position: fixed;

  top: 20px;
  left: 22px;

  z-index: 30;

  font-family: Arial, Helvetica, sans-serif;
  font-size: 11px;
  letter-spacing: .12em;

  color: #111;

  pointer-events: none;
}

</style>
</head>

<body>

<div id="stage">

  <div id="poster">

    <!--
      新的平整版
      你刚刚上传的那张
    -->
    <img
      id="flatPoster"
      src="poster.png"
      draggable="false"
      alt=""
    >

    <!--
      这里会显示你的皱版
    -->
    <canvas id="wrinkledCanvas"></canvas>

  </div>

</div>


<img
  id="iron"
  src="iron.png"
  draggable="false"
  alt=""
>


<div id="hint">
  HOLD + DRAG TO IRON
</div>


<script>

const poster =
  document.getElementById("poster");

const canvas =
  document.getElementById("wrinkledCanvas");

const ctx =
  canvas.getContext("2d");

const iron =
  document.getElementById("iron");


const wrinkled =
  new Image();

wrinkled.src =
  "poster-wrinkled.png";


let ironing = false;

let lastX = null;
let lastY = null;



/* ========================================
   加载你自己的皱版
======================================== */

function loadWrinkledPoster() {

  const rect =
    poster.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;


  canvas.width =
    Math.round(rect.width * dpr);

  canvas.height =
    Math.round(rect.height * dpr);


  canvas.style.width =
    rect.width + "px";

  canvas.style.height =
    rect.height + "px";


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  ctx.globalCompositeOperation =
    "source-over";


  ctx.clearRect(
    0,
    0,
    rect.width,
    rect.height
  );


  /*
    这里没有任何褶皱滤镜。
    直接显示 poster-wrinkled.png。
  */

  ctx.drawImage(
    wrinkled,
    0,
    0,
    rect.width,
    rect.height
  );

}


wrinkled.onload =
  loadWrinkledPoster;



/* ========================================
   熨斗真正接触纸面的区域
======================================== */

function ironAt(clientX, clientY) {

  const rect =
    canvas.getBoundingClientRect();


  if (
    clientX < rect.left ||
    clientX > rect.right ||
    clientY < rect.top ||
    clientY > rect.bottom
  ) {
    return;
  }


  const x =
    clientX - rect.left;

  const y =
    clientY - rect.top;


  ctx.save();


  /*
    把皱版局部擦掉
    下面的平整版自然出现
  */

  ctx.globalCompositeOperation =
    "destination-out";


  /*
    接触点略低于鼠标位置
  */

  ctx.translate(
    x,
    y + 18
  );


  ctx.rotate(
    -8 * Math.PI / 180
  );


  /*
    做成长椭圆，
    模拟熨斗底板，而不是圆形橡皮擦
  */

  ctx.scale(
    1,
    0.28
  );


  const radius = 82;


  const gradient =
    ctx.createRadialGradient(
      0,
      0,
      15,
      0,
      0,
      radius
    );


  /*
    中间完全熨平
    边缘非常轻微过渡
  */

  gradient.addColorStop(
    0,
    "rgba(0,0,0,1)"
  );

  gradient.addColorStop(
    0.72,
    "rgba(0,0,0,1)"
  );

  gradient.addColorStop(
    0.9,
    "rgba(0,0,0,.65)"
  );

  gradient.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );


  ctx.fillStyle =
    gradient;


  ctx.beginPath();

  ctx.arc(
    0,
    0,
    radius,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.restore();

}



/* ========================================
   鼠标移动
======================================== */

document.addEventListener(
  "mousemove",
  function(event) {

    const x =
      event.clientX;

    const y =
      event.clientY;


    /* 熨斗跟着鼠标 */
    iron.style.left =
      x + "px";

    iron.style.top =
      y + "px";


    if (!ironing) {
      return;
    }


    /*
      连续补点。
      鼠标移动很快也不会出现断层。
    */

    if (
      lastX !== null &&
      lastY !== null
    ) {

      const dx =
        x - lastX;

      const dy =
        y - lastY;


      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      const steps =
        Math.max(
          1,
          Math.ceil(distance / 4)
        );


      for (
        let i = 0;
        i <= steps;
        i++
      ) {

        const px =
          lastX +
          dx * (i / steps);


        const py =
          lastY +
          dy * (i / steps);


        ironAt(
          px,
          py
        );

      }

    }

    else {

      ironAt(
        x,
        y
      );

    }


    lastX = x;
    lastY = y;

  }
);



/* ========================================
   按住鼠标 = 开始熨
======================================== */

document.addEventListener(
  "mousedown",
  function(event) {

    ironing = true;


    lastX =
      event.clientX;

    lastY =
      event.clientY;


    document.body.classList.add(
      "ironing"
    );


    ironAt(
      event.clientX,
      event.clientY
    );

  }
);



/* ========================================
   松开 = 停止
======================================== */

function stopIroning() {

  ironing = false;

  lastX = null;
  lastY = null;


  document.body.classList.remove(
    "ironing"
  );

}


document.addEventListener(
  "mouseup",
  stopIroning
);


document.addEventListener(
  "mouseleave",
  stopIroning
);

</script>

</body>
</html>
