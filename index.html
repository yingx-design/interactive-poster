<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Iron The Poster</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #d8d8d8;
      cursor: none;
    }

    /* 整个页面 */
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 海报 */
    #poster {
      position: absolute;
      height: 94vh;
      width: auto;
      max-width: 94vw;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
      z-index: 1;

      /* 一点点纸张立体感 */
      filter:
        drop-shadow(0px 18px 25px rgba(0,0,0,0.25));
    }

    /* 褶皱层 */
    #wrinkleCanvas {
      position: absolute;
      z-index: 2;
      pointer-events: none;
    }

    /* 熨斗 */
    #iron {
      position: fixed;
      width: 220px;
      height: auto;

      left: 0;
      top: 0;

      z-index: 10;

      pointer-events: none;
      user-select: none;

      /*
        熨斗图片的尖端稍微偏离鼠标中心。
        后面可以根据你的 PNG 再调。
      */
      transform:
        translate(-30%, -72%)
        rotate(-8deg);

      filter:
        drop-shadow(12px 18px 10px rgba(0,0,0,0.28));

      transition:
        filter 0.15s ease;
    }

    /* 按住鼠标的时候 */
    body.ironing #iron {
      filter:
        drop-shadow(5px 8px 5px rgba(0,0,0,0.22));
    }

    /* 左上角提示 */
    #instruction {
      position: fixed;
      left: 22px;
      top: 20px;

      z-index: 20;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;

      color: white;
      mix-blend-mode: difference;

      pointer-events: none;

      opacity: 0.75;
    }
  </style>
</head>


<body>

  <div id="stage">

    <!-- 原始平整海报 -->
    <img
      id="poster"
      src="poster.png"
      alt="Poster"
      draggable="false"
    >

    <!-- 程序生成的褶皱 -->
    <canvas id="wrinkleCanvas"></canvas>

  </div>


  <!-- 熨斗 -->
  <img
    id="iron"
    src="iron.png"
    alt="Iron"
    draggable="false"
  >


  <div id="instruction">
    Hold + Drag to Iron
  </div>



<script>

  const poster = document.getElementById("poster");
  const canvas = document.getElementById("wrinkleCanvas");
  const ctx = canvas.getContext("2d");

  const iron = document.getElementById("iron");

  let ironing = false;

  let lastX = null;
  let lastY = null;



  /* ---------------------------------------
     1. 让 Canvas 永远覆盖海报
  --------------------------------------- */

  function resizeCanvas() {

    const rect = poster.getBoundingClientRect();

    canvas.style.left = rect.left + "px";
    canvas.style.top = rect.top + "px";

    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";

    canvas.width = Math.round(rect.width);
    canvas.height = Math.round(rect.height);

    createWrinkles();
  }



  /* ---------------------------------------
     2. 自动生成褶皱
  --------------------------------------- */

  function createWrinkles() {

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    /*
      整张纸轻微的灰色质感
    */

    ctx.fillStyle = "rgba(255,255,255,0.04)";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    /*
      生成很多不规则折痕
    */

    const wrinkleCount = 45;


    for (let i = 0; i < wrinkleCount; i++) {

      const startX =
        Math.random() * canvas.width;

      const startY =
        Math.random() * canvas.height;


      const length =
        100 + Math.random() * 350;


      const angle =
        Math.random() * Math.PI * 2;


      const endX =
        startX + Math.cos(angle) * length;

      const endY =
        startY + Math.sin(angle) * length;


      /*
        黑色阴影
      */

      ctx.beginPath();

      ctx.moveTo(
        startX,
        startY
      );


      const controlX =
        (startX + endX) / 2
        + (Math.random() - 0.5) * 120;


      const controlY =
        (startY + endY) / 2
        + (Math.random() - 0.5) * 120;


      ctx.quadraticCurveTo(
        controlX,
        controlY,
        endX,
        endY
      );


      ctx.strokeStyle =
        "rgba(0,0,0," +
        (0.12 + Math.random() * 0.18) +
        ")";


      ctx.lineWidth =
        8 + Math.random() * 22;


      ctx.lineCap = "round";

      ctx.stroke();



      /*
        折痕旁边的高光
      */

      ctx.beginPath();

      ctx.moveTo(
        startX + 4,
        startY + 4
      );


      ctx.quadraticCurveTo(
        controlX + 4,
        controlY + 4,
        endX + 4,
        endY + 4
      );


      ctx.strokeStyle =
        "rgba(255,255,255," +
        (0.08 + Math.random() * 0.16) +
        ")";


      ctx.lineWidth =
        4 + Math.random() * 12;


      ctx.stroke();

    }



    /*
      大型折痕
    */

    for (let i = 0; i < 10; i++) {

      const x =
        Math.random() * canvas.width;

      const y =
        Math.random() * canvas.height;


      const gradient =
        ctx.createRadialGradient(
          x,
          y,
          0,
          x,
          y,
          100 + Math.random() * 160
        );


      gradient.addColorStop(
        0,
        "rgba(255,255,255,0.12)"
      );


      gradient.addColorStop(
        0.45,
        "rgba(0,0,0,0.10)"
      );


      gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
      );


      ctx.fillStyle = gradient;


      ctx.beginPath();

      ctx.arc(
        x,
        y,
        120 + Math.random() * 120,
        0,
        Math.PI * 2
      );

      ctx.fill();

    }

  }



  /* ---------------------------------------
     3. 熨平某一个位置
  --------------------------------------- */

  function eraseWrinkle(x, y) {

    const rect =
      canvas.getBoundingClientRect();


    /*
      把浏览器坐标转换成 Canvas 坐标
    */

    const canvasX =
      (x - rect.left)
      * (canvas.width / rect.width);


    const canvasY =
      (y - rect.top)
      * (canvas.height / rect.height);



    /*
      熨斗影响范围
    */

    const radius = 85;



    ctx.save();


    ctx.globalCompositeOperation =
      "destination-out";



    /*
      使用渐变，
      所以不是突然出现一个圆形洞，
      而是慢慢被熨平。
    */

    const gradient =
      ctx.createRadialGradient(
        canvasX,
        canvasY,
        10,
        canvasX,
        canvasY,
        radius
      );


    gradient.addColorStop(
      0,
      "rgba(0,0,0,0.95)"
    );


    gradient.addColorStop(
      0.55,
      "rgba(0,0,0,0.65)"
    );


    gradient.addColorStop(
      1,
      "rgba(0,0,0,0)"
    );


    ctx.fillStyle = gradient;


    ctx.beginPath();

    ctx.arc(
      canvasX,
      canvasY,
      radius,
      0,
      Math.PI * 2
    );

    ctx.fill();


    ctx.restore();

  }



  /* ---------------------------------------
     4. 鼠标控制熨斗
  --------------------------------------- */

  document.addEventListener(
    "mousemove",
    function(event) {

      const x = event.clientX;
      const y = event.clientY;


      iron.style.left =
        x + "px";

      iron.style.top =
        y + "px";


      /*
        只有按住鼠标才熨
      */

      if (ironing) {

        /*
          如果鼠标移动得很快，
          在两个位置之间补点，
          避免出现断开的熨烫轨迹。
        */

        if (
          lastX !== null &&
          lastY !== null
        ) {

          const dx = x - lastX;
          const dy = y - lastY;

          const distance =
            Math.sqrt(
              dx * dx +
              dy * dy
            );


          const steps =
            Math.max(
              1,
              Math.ceil(distance / 15)
            );


          for (
            let i = 0;
            i <= steps;
            i++
          ) {

            const px =
              lastX +
              dx * (i / steps);

            const py =
              lastY +
              dy * (i / steps);


            eraseWrinkle(
              px,
              py
            );

          }

        }

        else {

          eraseWrinkle(
            x,
            y
          );

        }


        lastX = x;
        lastY = y;

      }

    }
  );



  /* ---------------------------------------
     5. 按下鼠标 = 开始熨
  --------------------------------------- */

  document.addEventListener(
    "mousedown",
    function(event) {

      ironing = true;

      lastX =
        event.clientX;

      lastY =
        event.clientY;


      document.body.classList.add(
        "ironing"
      );


      eraseWrinkle(
        event.clientX,
        event.clientY
      );

    }
  );



  /* ---------------------------------------
     6. 松开鼠标 = 停止
  --------------------------------------- */

  document.addEventListener(
    "mouseup",
    function() {

      ironing = false;

      lastX = null;
      lastY = null;


      document.body.classList.remove(
        "ironing"
      );

    }
  );



  /* ---------------------------------------
     7. 海报加载以后初始化
  --------------------------------------- */

  poster.addEventListener(
    "load",
    resizeCanvas
  );


  window.addEventListener(
    "resize",
    resizeCanvas
  );


  /*
    防止图片缓存后 load 已经结束
  */

  if (poster.complete) {

    resizeCanvas();

  }

</script>

</body>
</html>
