<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Iron the Poster</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #eeeeee;
  cursor: none;
}

/* 整个舞台 */
#stage {
  width: 100vw;
  height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;
}

/* 海报 */
#poster {
  position: relative;

  height: 94vh;
  max-width: 94vw;

  aspect-ratio: 0.707 / 1;

  overflow: hidden;

  background: black;

  box-shadow:
    0 18px 35px rgba(0,0,0,.22);
}


/* 下面：平整原图 */
#flat {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: fill;

  pointer-events: none;
  user-select: none;
}


/* 上面：你上传的皱版 */
#wrinkledCanvas {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  z-index: 2;

  pointer-events: none;
}


/* 熨斗 */
#iron {
  position: fixed;

  width: 220px;
  height: auto;

  left: 0;
  top: 0;

  z-index: 100;

  pointer-events: none;
  user-select: none;

  /*
  根据你的熨斗 PNG，
  让鼠标大概位于熨斗底板位置
  */
  transform:
    translate(-27%, -72%)
    rotate(-8deg);

  filter:
    drop-shadow(
      10px 14px 8px
      rgba(0,0,0,.28)
    );
}


/* 按住时稍微压下去 */
body.ironing #iron {
  transform:
    translate(-27%, -70%)
    rotate(-8deg)
    scale(.985);
}


/* 小提示 */
#instruction {
  position: fixed;

  left: 20px;
  top: 18px;

  z-index: 200;

  font-family: Arial, sans-serif;
  font-size: 11px;

  letter-spacing: .1em;

  color: #111;

  pointer-events: none;
}

</style>
</head>


<body>

<div id="stage">

  <div id="poster">

    <!-- 平整海报 -->
    <img
      id="flat"
      src="poster.png"
      draggable="false"
    >

    <!-- 皱版放在 Canvas -->
    <canvas id="wrinkledCanvas"></canvas>

  </div>

</div>


<!-- 熨斗 -->
<img
  id="iron"
  src="iron.png"
  draggable="false"
>


<div id="instruction">
  HOLD + DRAG TO IRON
</div>



<script>

const poster =
  document.getElementById("poster");

const canvas =
  document.getElementById("wrinkledCanvas");

const ctx =
  canvas.getContext("2d");

const iron =
  document.getElementById("iron");


const wrinkled =
  new Image();

wrinkled.src =
  "poster-wrinkled.png";


let ironing = false;

let lastX = null;
let lastY = null;



/* =================================
   显示你原来的皱版
================================= */

function drawWrinkledPoster() {

  const rect =
    poster.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;


  canvas.width =
    Math.round(rect.width * dpr);

  canvas.height =
    Math.round(rect.height * dpr);


  canvas.style.width =
    rect.width + "px";

  canvas.style.height =
    rect.height + "px";


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  ctx.globalCompositeOperation =
    "source-over";


  ctx.clearRect(
    0,
    0,
    rect.width,
    rect.height
  );


  /*
  不加滤镜。
  不加纹理。
  不加程序褶皱。

  就是直接显示 poster-wrinkled.png
  */

  ctx.drawImage(
    wrinkled,
    0,
    0,
    rect.width,
    rect.height
  );

}



wrinkled.onload =
  drawWrinkledPoster;


window.addEventListener(
  "resize",
  drawWrinkledPoster
);



/* =================================
   熨平
================================= */

function ironAt(clientX, clientY) {

  const rect =
    canvas.getBoundingClientRect();


  /* 不在海报上 */
  if (
    clientX < rect.left ||
    clientX > rect.right ||
    clientY < rect.top ||
    clientY > rect.bottom
  ) {
    return;
  }


  const x =
    clientX - rect.left;

  const y =
    clientY - rect.top;


  ctx.save();


  /*
  删除皱版，
  露出下面 poster.png
  */

  ctx.globalCompositeOperation =
    "destination-out";


  /*
  熨斗底板不是圆的。

  这里用扁长椭圆，
  更像熨斗真正接触纸面的范围。
  */

  ctx.translate(
    x,
    y + 22
  );


  ctx.rotate(
    -8 * Math.PI / 180
  );


  /*
  横向约 150px
  纵向约 55px
  */

  ctx.scale(
    1,
    0.36
  );


  ctx.beginPath();


  ctx.arc(
    0,
    0,
    78,
    0,
    Math.PI * 2
  );


  ctx.fillStyle =
    "rgba(0,0,0,0.72)";


  ctx.fill();


  ctx.restore();

}



/* =================================
   熨斗移动
================================= */

document.addEventListener(
  "mousemove",
  function(event) {

    const x =
      event.clientX;

    const y =
      event.clientY;


    /* 熨斗跟随鼠标 */
    iron.style.left =
      x + "px";

    iron.style.top =
      y + "px";


    if (!ironing) {
      return;
    }


    /*
    补点，让熨烫轨迹连续
    */

    if (
      lastX !== null &&
      lastY !== null
    ) {

      const dx =
        x - lastX;

      const dy =
        y - lastY;


      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      const steps =
        Math.max(
          1,
          Math.ceil(distance / 5)
        );


      for (
        let i = 0;
        i <= steps;
        i++
      ) {

        const px =
          lastX +
          dx * (i / steps);


        const py =
          lastY +
          dy * (i / steps);


        ironAt(
          px,
          py
        );

      }

    }

    else {

      ironAt(
        x,
        y
      );

    }


    lastX = x;
    lastY = y;

  }
);



/* =================================
   开始熨
================================= */

document.addEventListener(
  "mousedown",
  function(event) {

    ironing = true;


    lastX =
      event.clientX;

    lastY =
      event.clientY;


    document.body.classList.add(
      "ironing"
    );


    ironAt(
      event.clientX,
      event.clientY
    );

  }
);



/* =================================
   停止熨
================================= */

document.addEventListener(
  "mouseup",
  stopIroning
);


document.addEventListener(
  "mouseleave",
  stopIroning
);


function stopIroning() {

  ironing = false;

  lastX = null;
  lastY = null;


  document.body.classList.remove(
    "ironing"
  );

}

</script>

</body>
</html>
