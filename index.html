<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iron The Poster</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #d7d7d7;
  cursor: none;
}

#stage {
  width: 100vw;
  height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;
}

#poster {
  position: relative;

  height: 96vh;
  max-width: 96vw;

  aspect-ratio: 0.707 / 1;

  overflow: hidden;
  background: #000;

  box-shadow:
    0 20px 45px rgba(0,0,0,.25);
}

/* 下面：平整版 */
#flatPoster {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: fill;

  pointer-events: none;
  user-select: none;
}

/* 上面：皱版 */
#wrinkledCanvas {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  z-index: 2;

  pointer-events: none;
}

/* 熨斗 */
#iron {
  position: fixed;

  width: 230px;
  height: auto;

  left: -500px;
  top: -500px;

  z-index: 20;

  pointer-events: none;
  user-select: none;

  transform:
    translate(-31%, -76%)
    rotate(-8deg);

  transform-origin: center center;

  filter:
    drop-shadow(
      10px 14px 8px
      rgba(0,0,0,.28)
    );
}

body.ironing #iron {
  transform:
    translate(-31%, -73%)
    rotate(-8deg)
    scale(.985);

  filter:
    drop-shadow(
      5px 7px 4px
      rgba(0,0,0,.22)
    );
}

#hint {
  position: fixed;

  top: 20px;
  left: 22px;

  z-index: 30;

  font-family: Arial, Helvetica, sans-serif;
  font-size: 11px;
  letter-spacing: .12em;

  color: #111;

  pointer-events: none;
}
</style>
</head>

<body>

<div id="stage">

  <div id="poster">

    <!-- 平整版：只用 poster-flat.png -->
    <img
      id="flatPoster"
      src="poster-flat.png"
      draggable="false"
      alt=""
    >

    <!-- 皱版 -->
    <canvas id="wrinkledCanvas"></canvas>

  </div>

</div>

<img
  id="iron"
  src="iron.png"
  draggable="false"
  alt=""
>

<div id="hint">
  HOLD + DRAG TO IRON
</div>

<script>

const poster =
  document.getElementById("poster");

const canvas =
  document.getElementById("wrinkledCanvas");

const ctx =
  canvas.getContext("2d");

const iron =
  document.getElementById("iron");

const wrinkled =
  new Image();

wrinkled.src =
  "poster-wrinkled.png";

let ironing = false;

let lastX = null;
let lastY = null;


/* =========================
   加载皱版
========================= */

function loadWrinkledPoster() {

  const rect =
    poster.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;

  canvas.width =
    Math.round(rect.width * dpr);

  canvas.height =
    Math.round(rect.height * dpr);

  canvas.style.width =
    rect.width + "px";

  canvas.style.height =
    rect.height + "px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  ctx.globalCompositeOperation =
    "source-over";

  ctx.clearRect(
    0,
    0,
    rect.width,
    rect.height
  );

  ctx.drawImage(
    wrinkled,
    0,
    0,
    rect.width,
    rect.height
  );
}

wrinkled.onload =
  loadWrinkledPoster;


/* =========================
   熨平
========================= */

function ironAt(clientX, clientY) {

  const rect =
    canvas.getBoundingClientRect();

  if (
    clientX < rect.left ||
    clientX > rect.right ||
    clientY < rect.top ||
    clientY > rect.bottom
  ) {
    return;
  }

  const x =
    clientX - rect.left;

  const y =
    clientY - rect.top;

  ctx.save();

  /*
    擦掉皱版
    显示下面的 poster-flat.png
  */
  ctx.globalCompositeOperation =
    "destination-out";

  /*
    熨斗真正接触纸张的位置
  */
  ctx.translate(
    x,
    y + 18
  );

  ctx.rotate(
    -8 * Math.PI / 180
  );

  /*
    做成扁长形，
    不再像圆形橡皮擦
  */
  ctx.scale(
    1,
    0.30
  );

  const radius = 85;

  const gradient =
    ctx.createRadialGradient(
      0,
      0,
      10,
      0,
      0,
      radius
    );

  gradient.addColorStop(
    0,
    "rgba(0,0,0,1)"
  );

  gradient.addColorStop(
    0.72,
    "rgba(0,0,0,1)"
  );

  gradient.addColorStop(
    0.9,
    "rgba(0,0,0,.55)"
  );

  gradient.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.fillStyle =
    gradient;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    radius,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.restore();
}


/* =========================
   熨斗跟随鼠标
========================= */

document.addEventListener(
  "mousemove",
  function(event) {

    const x =
      event.clientX;

    const y =
      event.clientY;

    iron.style.left =
      x + "px";

    iron.style.top =
      y + "px";

    if (!ironing) {
      return;
    }

    if (
      lastX !== null &&
      lastY !== null
    ) {

      const dx =
        x - lastX;

      const dy =
        y - lastY;

      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );

      const steps =
        Math.max(
          1,
          Math.ceil(distance / 4)
        );

      for (
        let i = 0;
        i <= steps;
        i++
      ) {

        const px =
          lastX +
          dx * (i / steps);

        const py =
          lastY +
          dy * (i / steps);

        ironAt(
          px,
          py
        );
      }
    }

    else {

      ironAt(
        x,
        y
      );
    }

    lastX = x;
    lastY = y;
  }
);


/* =========================
   开始熨
========================= */

document.addEventListener(
  "mousedown",
  function(event) {

    ironing = true;

    lastX =
      event.clientX;

    lastY =
      event.clientY;

    document.body.classList.add(
      "ironing"
    );

    ironAt(
      event.clientX,
      event.clientY
    );
  }
);


/* =========================
   停止熨
========================= */

function stopIroning() {

  ironing = false;

  lastX = null;
  lastY = null;

  document.body.classList.remove(
    "ironing"
  );
}

document.addEventListener(
  "mouseup",
  stopIroning
);

document.addEventListener(
  "mouseleave",
  stopIroning
);

</script>

</body>
</html>
